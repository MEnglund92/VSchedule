<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veronikas Schema — Concept 2: Neon Dark</title>
  <style>
    :root {
      --slot-h: 60px;
      --time-col-w: 100px;
      --day-min-w: 220px;
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff00ff;
      --neon-lime: #39ff14;
      --neon-pink: #ff0066;
      --neon-blue: #0066ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #111118;
      border-bottom: 1px solid #1e1e2e;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.2);
    }

    .header-title svg {
      width: 24px;
      height: 24px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .day-tabs {
      display: flex;
      gap: 4px;
    }

    .day-tab {
      background: #16161f;
      border: 1px solid #2a2a3a;
      color: #888;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .day-tab:hover {
      color: #ccc;
      border-color: #444;
    }

    .day-tab.active {
      background: rgba(0, 240, 255, 0.1);
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3), inset 0 0 8px rgba(0, 240, 255, 0.05);
    }

    .view-toggle {
      display: flex;
      background: #16161f;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #2a2a3a;
    }

    .view-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #666;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .view-btn svg {
      width: 16px;
      height: 16px;
    }

    .view-btn:hover { color: #aaa; }

    .view-btn.active {
      background: rgba(0, 240, 255, 0.08);
      color: var(--neon-cyan);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      padding: 6px 14px;
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .search-box input {
      background: none;
      border: none;
      color: #e0e0e0;
      font-size: 0.85rem;
      outline: none;
      width: 130px;
      font-family: inherit;
    }

    .search-box input::placeholder { color: #555; }

    .ics-download {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #16161f;
      border: 1px solid #2a2a3a;
      color: #aaa;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .ics-download svg {
      width: 16px;
      height: 16px;
    }

    .ics-download:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    .theme-toggle {
      background: #16161f;
      border: 1px solid #2a2a3a;
      color: #aaa;
      width: 36px;
      height: 36px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .theme-toggle:hover {
      color: var(--neon-magenta);
      border-color: var(--neon-magenta);
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.2);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      padding: 20px 24px;
      position: relative;
    }

    /* ── Grid View ── */
    .grid-view {
      display: none;
    }

    body.view-active.grid .grid-view { display: block; }
    body.view-active.cards .grid-view { display: none; }

    .timetable-wrapper {
      overflow-x: auto;
      padding-bottom: 20px;
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-col-w) repeat(5, minmax(var(--day-min-w), 1fr));
      gap: 1px;
      min-width: calc(var(--time-col-w) + 5 * var(--day-min-w));
    }

    .time-header,
    .day-header {
      background: #111118;
      padding: 12px 10px;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid #1e1e2e;
    }

    .day-header {
      border-bottom: 2px solid var(--neon-cyan);
      box-shadow: 0 2px 12px rgba(0, 240, 255, 0.15);
    }

    .time-header {
      color: #555;
      font-weight: 400;
    }

    .time-label {
      background: #0e0e16;
      padding: 8px;
      font-size: 0.75rem;
      color: #4a4a5a;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1a1a28;
      min-height: var(--slot-h);
    }

    .grid-cell {
      background: #0c0c14;
      border: 1px solid #151520;
      min-height: var(--slot-h);
    }

    .day-column {
      position: relative;
      background: #0d0d15;
      border: 1px solid #181825;
    }

    .class-block {
      position: absolute;
      left: 4px;
      right: 4px;
      background: #12121c;
      border: 1px solid var(--color, #444);
      border-radius: 4px;
      padding: 8px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      transition: all 0.25s ease;
      border-left: 3px solid var(--color, #444);
      box-shadow: 0 0 6px color-mix(in srgb, var(--color, #444) 30%, transparent);
    }

    .class-block:hover {
      box-shadow: 0 0 16px color-mix(in srgb, var(--color, #00f0ff) 50%, transparent),
                  inset 0 0 12px color-mix(in srgb, var(--color, #00f0ff) 10%, transparent);
      border-color: var(--color, #00f0ff);
      background: #18182a;
    }

    .class-block .time {
      font-size: 0.7rem;
      color: #666;
    }

    .class-block .subject {
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.2;
      color: var(--color, #00f0ff);
      text-shadow: 0 0 8px color-mix(in srgb, var(--color, #00f0ff) 40%, transparent);
    }

    .class-block .teacher {
      font-size: 0.75rem;
      color: #555;
    }

    .class-block.compact .subject {
      font-size: 0.78rem;
    }

    .now-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink), 0 0 20px rgba(255, 0, 102, 0.4);
      z-index: 10;
      pointer-events: none;
    }

    /* ── Cards View ── */
    .cards-view {
      display: none;
    }

    body.view-active.cards .cards-view { display: block; }
    body.view-active.cards .grid-view { display: none; }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .class-card {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .class-card:hover {
      border-color: var(--color, var(--neon-cyan));
      box-shadow: 0 0 16px color-mix(in srgb, var(--color, #00f0ff) 30%, transparent);
    }

    .class-card .color-bar {
      height: 3px;
      background: var(--color, #444);
      box-shadow: 0 0 8px color-mix(in srgb, var(--color, #00f0ff) 50%, transparent);
    }

    .class-card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .class-card-time {
      font-size: 0.78rem;
      color: #555;
    }

    .class-card-subject {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color, var(--neon-cyan));
      text-shadow: 0 0 6px color-mix(in srgb, var(--color, #00f0ff) 30%, transparent);
    }

    .class-card-teacher {
      font-size: 0.82rem;
      color: #555;
    }

    /* ── Legend ── */
    .legend {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      padding: 18px 22px;
      margin-top: 24px;
    }

    .legend-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      box-shadow: 0 0 6px color-mix(in srgb, currentColor 40%, transparent);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 18px 24px;
      font-size: 0.78rem;
      color: #333;
      border-top: 1px solid #151520;
    }

    /* ── Utilities ── */
    .hidden { display: none !important; }
    .dimmed { opacity: 0.25; }

    /* ── Light theme overrides ── */
    body[data-theme="light"] {
      background: #f0f0f5;
      color: #222;
    }

    body[data-theme="light"] .header {
      background: #fff;
      border-bottom-color: #ddd;
    }

    body[data-theme="light"] .header-title {
      color: #0088aa;
      text-shadow: none;
    }

    body[data-theme="light"] .day-tab {
      background: #f5f5fa;
      border-color: #ddd;
      color: #666;
    }

    body[data-theme="light"] .day-tab.active {
      background: rgba(0, 136, 170, 0.1);
      color: #0088aa;
      border-color: #0088aa;
      box-shadow: none;
    }

    body[data-theme="light"] .view-toggle {
      background: #f5f5fa;
      border-color: #ddd;
    }

    body[data-theme="light"] .view-btn { color: #888; }
    body[data-theme="light"] .view-btn.active { color: #0088aa; background: rgba(0, 136, 170, 0.08); }

    body[data-theme="light"] .search-box {
      background: #f5f5fa;
      border-color: #ddd;
    }

    body[data-theme="light"] .search-box input { color: #222; }
    body[data-theme="light"] .search-box input::placeholder { color: #aaa; }

    body[data-theme="light"] .ics-download {
      background: #f5f5fa;
      border-color: #ddd;
      color: #666;
    }

    body[data-theme="light"] .theme-toggle {
      background: #f5f5fa;
      border-color: #ddd;
      color: #666;
    }

    body[data-theme="light"] .time-header,
    body[data-theme="light"] .day-header {
      background: #fff;
      border-color: #e5e5ea;
    }

    body[data-theme="light"] .day-header {
      border-bottom-color: #0088aa;
      box-shadow: none;
    }

    body[data-theme="light"] .time-label {
      background: #f8f8fc;
      border-color: #eaeaf0;
      color: #999;
    }

    body[data-theme="light"] .grid-cell {
      background: #fafafe;
      border-color: #eee;
    }

    body[data-theme="light"] .day-column {
      background: #f6f6fb;
      border-color: #e8e8f0;
    }

    body[data-theme="light"] .class-block {
      background: #fff;
      border-color: #ddd;
      border-left-color: var(--color, #888);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body[data-theme="light"] .class-block:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    body[data-theme="light"] .class-block .time { color: #999; }
    body[data-theme="light"] .class-block .subject { color: #222; text-shadow: none; }
    body[data-theme="light"] .class-block .teacher { color: #888; }

    body[data-theme="light"] .class-card {
      background: #fff;
      border-color: #e5e5ea;
    }

    body[data-theme="light"] .class-card-subject { color: #222; text-shadow: none; }
    body[data-theme="light"] .class-card-time { color: #999; }
    body[data-theme="light"] .class-card-teacher { color: #888; }

    body[data-theme="light"] .legend {
      background: #fff;
      border-color: #e5e5ea;
    }

    body[data-theme="light"] .legend-title { color: #999; }
    body[data-theme="light"] .legend-item { color: #555; }

    body[data-theme="light"] .footer {
      color: #bbb;
      border-top-color: #e5e5ea;
    }

    body[data-theme="light"] ::-webkit-scrollbar-track { background: #f0f0f5; }
    body[data-theme="light"] ::-webkit-scrollbar-thumb { background: #ccc; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }
  </style>
</head>
<body class="view-active grid" data-theme="dark">
  <header class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Veronikas Schema
    </div>
    <div class="header-controls">
      <div class="day-tabs">
        <button class="day-tab active" data-day="all">Alla</button>
        <button class="day-tab" data-day="1">Mån</button>
        <button class="day-tab" data-day="2">Tis</button>
        <button class="day-tab" data-day="3">Ons</button>
        <button class="day-tab" data-day="4">Tor</button>
        <button class="day-tab" data-day="5">Fre</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Schema
        </button>
        <button class="view-btn" data-view="cards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/></svg>
          Kort
        </button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Sök lektion..." />
      </div>
      <a class="ics-download" href="schedule.ics" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        .ics
      </a>
      <button class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="main">
    <div class="grid-view">
      <div class="timetable-wrapper">
        <div class="timetable"></div>
      </div>
    </div>
    <div class="cards-view">
      <div class="cards-container"></div>
    </div>
    <div class="legend">
      <div class="legend-title">Ämnen</div>
      <div class="legend-grid"></div>
    </div>
  </main>
  <footer class="footer">Veronikas schema — vecka 36 till 24</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

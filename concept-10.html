<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veronikas Schema — Pastel Clean</title>
  <style>
    :root {
      --slot-h: 60px;
      --time-col-w: 100px;
      --day-min-w: 220px;
      --bg: #fafbff;
      --pink: #ffb3c6;
      --blue: #a2d2ff;
      --green: #b8e0d2;
      --purple: #d5b8ff;
      --yellow: #fff3b0;
      --coral: #ffcdb2;
      --header-blue: #4361ee;
      --text: #2d2d3a;
      --text-mid: #6b6b80;
      --text-light: #9a9ab0;
      --border: #eef0f5;
      --shadow: rgba(100,100,160,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-weight: 400;
    }

    .hidden { display: none !important; }
    .dimmed { opacity: 0.25; }

    .header {
      background: var(--header-blue);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title {
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title svg {
      width: 22px;
      height: 22px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .day-tabs {
      display: flex;
      gap: 1px;
    }

    .day-tab {
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75);
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 0;
      transition: all 0.2s;
    }

    .day-tab:first-child { border-radius: 8px 0 0 8px; }
    .day-tab:last-child { border-radius: 0 8px 8px 0; }

    .day-tab:hover {
      background: rgba(255,255,255,0.28);
      color: #fff;
    }

    .day-tab.active {
      background: #fff;
      color: var(--header-blue);
      font-weight: 600;
    }

    .view-toggle {
      display: flex;
      gap: 1px;
    }

    .view-btn {
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.75);
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .view-btn:first-child { border-radius: 8px 0 0 8px; }
    .view-btn:last-child { border-radius: 0 8px 8px 0; }

    .view-btn svg { width: 15px; height: 15px; }

    .view-btn:hover {
      background: rgba(255,255,255,0.28);
      color: #fff;
    }

    .view-btn.active {
      background: #fff;
      color: var(--header-blue);
      font-weight: 600;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
    }

    .search-box svg { width: 15px; height: 15px; opacity: 0.7; }

    .search-box input {
      background: none;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      outline: none;
      width: 140px;
    }

    .search-box input::placeholder { color: rgba(255,255,255,0.6); }

    .ics-download {
      color: #fff;
      background: rgba(255,255,255,0.18);
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      text-decoration: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .ics-download svg { width: 15px; height: 15px; }
    .ics-download:hover { background: rgba(255,255,255,0.3); }

    .theme-toggle {
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle:hover { background: rgba(255,255,255,0.3); }

    .main {
      padding: 24px;
    }

    .timetable-wrapper {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: 0 2px 16px var(--shadow);
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-col-w) repeat(5, minmax(var(--day-min-w), 1fr));
      position: relative;
      min-width: fit-content;
    }

    .time-header {
      background: var(--header-blue);
      padding: 12px;
      text-align: center;
      font-weight: 600;
      border-bottom: none;
      font-size: 0.8rem;
      color: #fff;
      border-radius: 0;
    }

    .day-header {
      background: #fff;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      font-size: 0.85rem;
      color: var(--text);
    }

    .time-label {
      padding: 10px;
      text-align: center;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--text-light);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .grid-cell {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: #fff;
      min-height: var(--slot-h);
    }

    .grid-cell:nth-child(odd) {
      background: #fcfcff;
    }

    .day-column {
      position: relative;
    }

    .class-block {
      position: absolute;
      left: 5px;
      right: 5px;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.78rem;
      overflow: hidden;
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
    }

    .class-block:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(100,100,160,0.15);
    }

    .class-block.compact .time,
    .class-block.compact .teacher { display: none; }

    .class-block .time {
      font-size: 0.68rem;
      opacity: 0.6;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .class-block .subject {
      font-weight: 600;
      font-size: 0.85rem;
      line-height: 1.2;
      color: var(--text);
    }

    .class-block .teacher {
      font-size: 0.72rem;
      opacity: 0.55;
      margin-top: 2px;
      font-weight: 500;
    }

    .now-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 2.5px;
      background: var(--coral);
      z-index: 20;
      pointer-events: none;
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(255,205,178,0.5);
    }

    .now-indicator::before {
      content: '';
      position: absolute;
      left: -5px;
      top: -4px;
      width: 10px;
      height: 10px;
      background: var(--coral);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255,205,178,0.4);
    }

    .cards-view { display: none; }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .class-card {
      background: #fff;
      border-radius: 12px;
      border: none;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
      transition: all 0.25s ease;
    }

    .class-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(100,100,160,0.12);
    }

    .class-card.color-bar {
      border-left: 5px solid currentColor;
    }

    .class-card-content { padding: 16px 18px; }

    .class-card-time {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .class-card-subject {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .class-card-teacher {
      font-size: 0.82rem;
      color: var(--text-mid);
      font-weight: 500;
    }

    .legend {
      margin-top: 24px;
      padding: 18px 22px;
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px var(--shadow);
    }

    .legend-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 14px;
      color: var(--text);
    }

    .legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-mid);
    }

    .legend-color {
      width: 18px;
      height: 18px;
      border-radius: 5px;
    }

    .footer {
      text-align: center;
      padding: 18px;
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 24px;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: flex-start; }
      .header-controls { width: 100%; justify-content: flex-start; }
      .main { padding: 14px; }
    }
  </style>
</head>
<body class="view-active grid" data-theme="light">
  <header class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Veronikas Schema
    </div>
    <div class="header-controls">
      <div class="day-tabs">
        <button class="day-tab active" data-day="all">Alla</button>
        <button class="day-tab" data-day="1">Mån</button>
        <button class="day-tab" data-day="2">Tis</button>
        <button class="day-tab" data-day="3">Ons</button>
        <button class="day-tab" data-day="4">Tor</button>
        <button class="day-tab" data-day="5">Fre</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Schema
        </button>
        <button class="view-btn" data-view="cards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/></svg>
          Kort
        </button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Sök lektion..." />
      </div>
      <a class="ics-download" href="schedule.ics" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        .ics
      </a>
      <button class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="main">
    <div class="grid-view">
      <div class="timetable-wrapper">
        <div class="timetable"></div>
      </div>
    </div>
    <div class="cards-view">
      <div class="cards-container"></div>
    </div>
    <div class="legend">
      <div class="legend-title">Ämnen</div>
      <div class="legend-grid"></div>
    </div>
  </main>
  <footer class="footer">Veronikas schema — vecka 36 till 24</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

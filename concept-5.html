<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veronikas Schema — Material 3</title>
  <style>
    :root {
      --slot-h: 60px;
      --time-col-w: 100px;
      --day-min-w: 220px;
      --md-primary: #1a6b5a;
      --md-on-primary: #ffffff;
      --md-primary-container: #a4f2dc;
      --md-on-primary-container: #00201b;
      --md-secondary: #4b635d;
      --md-on-secondary: #ffffff;
      --md-secondary-container: #cde8e0;
      --md-surface: #f5f5f5;
      --md-surface-dim: #d9d9d9;
      --md-surface-container: #ececec;
      --md-surface-container-low: #f1f1f1;
      --md-surface-container-high: #e3e3e3;
      --md-on-surface: #1c1c1c;
      --md-on-surface-variant: #444444;
      --md-outline: #777777;
      --md-outline-variant: #c4c4c4;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.12);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.12);
      --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.12);
      --md-shape-sm: 8px;
      --md-shape-md: 12px;
      --md-shape-lg: 16px;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-weight: 400;
      background: var(--md-surface);
      color: var(--md-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.dark {
      --md-primary: #88d6be;
      --md-on-primary: #00382e;
      --md-primary-container: #005044;
      --md-on-primary-container: #a4f2dc;
      --md-secondary: #b1ccc3;
      --md-on-secondary: #1d352f;
      --md-secondary-container: #334b45;
      --md-surface: #1a1c1b;
      --md-surface-dim: #1a1c1b;
      --md-surface-container: #2c2f2d;
      --md-surface-container-low: #232524;
      --md-surface-container-high: #373937;
      --md-on-surface: #e1e3e0;
      --md-on-surface-variant: #bfcac5;
      --md-outline: #89938e;
      --md-outline-variant: #434944;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 64px;
      background: var(--md-primary);
      color: var(--md-on-primary);
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.01em;
    }

    .header-title svg {
      width: 24px;
      height: 24px;
      stroke: var(--md-on-primary);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .day-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: var(--md-shape-lg);
      padding: 4px;
    }

    .day-tab {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      border-radius: var(--md-shape-lg);
      transition: all 0.2s ease;
    }

    .day-tab.active {
      background: var(--md-on-primary);
      color: var(--md-primary);
    }

    .day-tab:hover:not(.active) {
      background: rgba(255,255,255,0.16);
    }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: var(--md-shape-lg);
      padding: 4px;
    }

    .view-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: var(--md-shape-lg);
      transition: all 0.2s ease;
    }

    .view-btn svg {
      width: 18px;
      height: 18px;
    }

    .view-btn.active {
      background: var(--md-on-primary);
      color: var(--md-primary);
    }

    .view-btn:hover:not(.active) {
      background: rgba(255,255,255,0.16);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: var(--md-shape-lg);
      padding: 8px 16px;
      transition: background 0.2s ease;
    }

    .search-box:focus-within {
      background: rgba(255,255,255,0.2);
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      stroke: rgba(255,255,255,0.7);
      flex-shrink: 0;
    }

    .search-box input {
      border: none;
      background: none;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      color: white;
      outline: none;
      width: 140px;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .ics-download {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--md-shape-lg);
      transition: background 0.2s ease;
    }

    .ics-download svg {
      width: 18px;
      height: 18px;
    }

    .ics-download:hover {
      background: rgba(255,255,255,0.2);
    }

    .theme-toggle {
      background: rgba(255,255,255,0.12);
      border: none;
      color: rgba(255,255,255,0.9);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s ease;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.2);
    }

    .main {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .grid-view { display: block; }
    .cards-view { display: none; }

    body.view-active .grid-view { display: block; }
    body.view-active .cards-view { display: none; }

    .timetable-wrapper {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-col-w) repeat(5, minmax(var(--day-min-w), 1fr));
      min-width: calc(var(--time-col-w) + 5 * var(--day-min-w));
      background: var(--md-surface-container-low);
      border-radius: var(--md-shape-lg);
      overflow: hidden;
      box-shadow: var(--md-elevation-1);
    }

    .time-header,
    .day-header {
      padding: 16px 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .time-header {
      background: var(--md-surface-container);
      color: var(--md-on-surface-variant);
    }

    .day-header {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }

    .time-label {
      padding: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--md-on-surface-variant);
      text-align: right;
      background: var(--md-surface-container-low);
    }

    .grid-cell {
      min-height: var(--slot-h);
      background: var(--md-surface-container-low);
      position: relative;
      border-top: 1px solid var(--md-outline-variant);
      border-left: 1px solid var(--md-outline-variant);
    }

    .day-column {
      position: relative;
    }

    .class-block {
      position: absolute;
      left: 4px;
      right: 4px;
      padding: 8px 10px;
      background: var(--md-primary-container);
      border-radius: var(--md-shape-md);
      font-size: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
      transition: box-shadow 0.2s ease;
      z-index: 1;
    }

    .class-block:hover {
      box-shadow: var(--md-elevation-2);
    }

    .class-block .time {
      font-size: 10px;
      color: var(--md-on-primary-container);
      font-weight: 500;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    .class-block .subject {
      font-size: 13px;
      font-weight: 500;
      color: var(--md-on-primary-container);
      margin-bottom: 2px;
    }

    .class-block .teacher {
      font-size: 11px;
      color: var(--md-on-primary-container);
      opacity: 0.7;
      font-weight: 400;
    }

    .class-block.compact .subject,
    .class-block.compact .teacher {
      font-size: 10px;
    }

    .now-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--md-primary);
      z-index: 2;
      pointer-events: none;
    }

    .now-indicator::before {
      content: '';
      position: absolute;
      left: -5px;
      top: -4px;
      width: 10px;
      height: 10px;
      background: var(--md-primary);
      border-radius: 50%;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .class-card {
      background: var(--md-surface-container-low);
      border-radius: var(--md-shape-lg);
      padding: 20px;
      box-shadow: var(--md-elevation-1);
      transition: box-shadow 0.2s ease;
    }

    .class-card:hover {
      box-shadow: var(--md-elevation-2);
    }

    .class-card.color-bar {
      border-left: 4px solid var(--md-primary);
    }

    .class-card-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .class-card-time {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      font-weight: 500;
    }

    .class-card-subject {
      font-size: 16px;
      font-weight: 500;
      color: var(--md-on-surface);
    }

    .class-card-teacher {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      font-weight: 400;
    }

    .legend {
      padding: 20px;
      background: var(--md-surface-container-low);
      border-radius: var(--md-shape-lg);
      box-shadow: var(--md-elevation-1);
    }

    .legend-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 400;
      color: var(--md-on-surface-variant);
      background: var(--md-surface-container);
      padding: 6px 12px;
      border-radius: var(--md-shape-sm);
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .footer {
      padding: 16px 24px;
      font-size: 12px;
      color: var(--md-on-surface-variant);
      background: var(--md-surface-container);
      font-weight: 400;
    }

    .hidden { display: none !important; }
    .dimmed { opacity: 0.25; }

    @media (max-width: 768px) {
      .header { padding: 0 16px; height: auto; min-height: 64px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
      .header-controls { gap: 8px; }
      .main { padding: 16px; }
      .search-box input { width: 100px; }
    }
  </style>
</head>
<body class="view-active grid" data-theme="light">
  <header class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Veronikas Schema
    </div>
    <div class="header-controls">
      <div class="day-tabs">
        <button class="day-tab active" data-day="all">Alla</button>
        <button class="day-tab" data-day="1">Mån</button>
        <button class="day-tab" data-day="2">Tis</button>
        <button class="day-tab" data-day="3">Ons</button>
        <button class="day-tab" data-day="4">Tor</button>
        <button class="day-tab" data-day="5">Fre</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Schema
        </button>
        <button class="view-btn" data-view="cards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/></svg>
          Kort
        </button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Sök lektion..." />
      </div>
      <a class="ics-download" href="schedule.ics" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        .ics
      </a>
      <button class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="main">
    <div class="grid-view">
      <div class="timetable-wrapper">
        <div class="timetable"></div>
      </div>
    </div>
    <div class="cards-view">
      <div class="cards-container"></div>
    </div>
    <div class="legend">
      <div class="legend-title">Ämnen</div>
      <div class="legend-grid"></div>
    </div>
  </main>
  <footer class="footer">Veronikas schema — vecka 36 till 24</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

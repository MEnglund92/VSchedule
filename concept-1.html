<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veronikas Schema — Concept 1: Glassmorphism</title>
  <style>
    :root {
      --slot-h: 60px;
      --time-col-w: 100px;
      --day-min-w: 220px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #7b2ff7, #2196f3, #00bcd4);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .header-title svg {
      width: 24px;
      height: 24px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .day-tabs {
      display: flex;
      gap: 4px;
    }

    .day-tab {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
      font-family: inherit;
    }

    .day-tab:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .day-tab.active {
      background: rgba(255, 255, 255, 0.35);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .view-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .view-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .view-btn svg {
      width: 16px;
      height: 16px;
    }

    .view-btn:hover { color: #fff; }

    .view-btn.active {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 6px 14px;
      backdrop-filter: blur(10px);
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .search-box input {
      background: none;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      width: 130px;
      font-family: inherit;
    }

    .search-box input::placeholder { color: rgba(255, 255, 255, 0.5); }

    .ics-download {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .ics-download svg {
      width: 16px;
      height: 16px;
    }

    .ics-download:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      padding: 20px 24px;
      position: relative;
    }

    /* ── Grid View ── */
    .grid-view {
      display: none;
    }

    body.view-active.grid .grid-view { display: block; }
    body.view-active.cards .grid-view { display: none; }

    .timetable-wrapper {
      overflow-x: auto;
      padding-bottom: 20px;
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-col-w) repeat(5, minmax(var(--day-min-w), 1fr));
      gap: 1px;
      min-width: calc(var(--time-col-w) + 5 * var(--day-min-w));
    }

    .time-header,
    .day-header {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 10px;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
    }

    .time-header {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 400;
    }

    .time-label {
      background: rgba(255, 255, 255, 0.08);
      padding: 8px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      min-height: var(--slot-h);
    }

    .grid-cell {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      min-height: var(--slot-h);
    }

    .day-column {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
    }

    .class-block {
      position: absolute;
      left: 4px;
      right: 4px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 8px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      transition: all 0.3s ease;
      border-left: 4px solid var(--color, rgba(255, 255, 255, 0.5));
    }

    .class-block:hover {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
      transform: translateY(-1px);
    }

    .class-block .time {
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .class-block .subject {
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.2;
    }

    .class-block .teacher {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .class-block.compact .subject {
      font-size: 0.78rem;
    }

    .now-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ff4d6a;
      box-shadow: 0 0 8px rgba(255, 77, 106, 0.7);
      z-index: 10;
      pointer-events: none;
    }

    /* ── Cards View ── */
    .cards-view {
      display: none;
    }

    body.view-active.cards .cards-view { display: block; }
    body.view-active.cards .grid-view { display: none; }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .class-card {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .class-card:hover {
      background: rgba(255, 255, 255, 0.26);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }

    .class-card .color-bar {
      height: 4px;
      border-radius: 0;
      background: var(--color, #888);
    }

    .class-card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .class-card-time {
      font-size: 0.78rem;
      opacity: 0.7;
    }

    .class-card-subject {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .class-card-teacher {
      font-size: 0.82rem;
      opacity: 0.65;
    }

    /* ── Legend ── */
    .legend {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 18px 22px;
      margin-top: 24px;
    }

    .legend-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.7;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 18px 24px;
      font-size: 0.78rem;
      opacity: 0.5;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* ── Utilities ── */
    .hidden { display: none !important; }
    .dimmed { opacity: 0.25; }

    /* ── Dark theme overrides ── */
    body[data-theme="dark"] {
      background: linear-gradient(135deg, #1a0a3e, #0d1b3e, #0a2a2e);
    }

    body[data-theme="dark"] .header {
      background: rgba(0, 0, 0, 0.3);
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    body[data-theme="dark"] .day-tab,
    body[data-theme="dark"] .view-toggle,
    body[data-theme="dark"] .search-box,
    body[data-theme="dark"] .ics-download,
    body[data-theme="dark"] .theme-toggle {
      background: rgba(0, 0, 0, 0.25);
      border-color: rgba(255, 255, 255, 0.1);
    }

    body[data-theme="dark"] .day-tab.active,
    body[data-theme="dark"] .view-btn.active {
      background: rgba(255, 255, 255, 0.12);
    }

    body[data-theme="dark"] .time-header,
    body[data-theme="dark"] .day-header {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
    }

    body[data-theme="dark"] .time-label {
      background: rgba(0, 0, 0, 0.2);
    }

    body[data-theme="dark"] .grid-cell {
      background: rgba(0, 0, 0, 0.15);
      border-color: rgba(255, 255, 255, 0.05);
    }

    body[data-theme="dark"] .class-block {
      background: rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.12);
    }

    body[data-theme="dark"] .class-block:hover {
      background: rgba(0, 0, 0, 0.5);
    }

    body[data-theme="dark"] .class-card {
      background: rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.1);
    }

    body[data-theme="dark"] .legend {
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
  </style>
</head>
<body class="view-active grid" data-theme="light">
  <header class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Veronikas Schema
    </div>
    <div class="header-controls">
      <div class="day-tabs">
        <button class="day-tab active" data-day="all">Alla</button>
        <button class="day-tab" data-day="1">Mån</button>
        <button class="day-tab" data-day="2">Tis</button>
        <button class="day-tab" data-day="3">Ons</button>
        <button class="day-tab" data-day="4">Tor</button>
        <button class="day-tab" data-day="5">Fre</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Schema
        </button>
        <button class="view-btn" data-view="cards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/></svg>
          Kort
        </button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Sök lektion..." />
      </div>
      <a class="ics-download" href="schedule.ics" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        .ics
      </a>
      <button class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="main">
    <div class="grid-view">
      <div class="timetable-wrapper">
        <div class="timetable"></div>
      </div>
    </div>
    <div class="cards-view">
      <div class="cards-container"></div>
    </div>
    <div class="legend">
      <div class="legend-title">Ämnen</div>
      <div class="legend-grid"></div>
    </div>
  </main>
  <footer class="footer">Veronikas schema — vecka 36 till 24</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

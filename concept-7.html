<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veronikas Schema — Nordic</title>
  <style>
    :root {
      --slot-h: 60px;
      --time-col-w: 100px;
      --day-min-w: 220px;
      --bg: #f8f6f0;
      --surface: #ffffff;
      --border: #d5cfc0;
      --text: #3d3a35;
      --text-muted: #8a847a;
      --text-light: #b0a99e;
      --sage: #8fae8b;
      --clay: #c4a882;
      --sand: #d4c5a9;
      --cream: #f0ebe0;
      --slate: #6b7b8d;
      --warm-brown: #8b7355;
      --forest: #2d4a3e;
      --dusty-rose: #c49a8a;
      --muted-teal: #7a9e9a;
      --warm-olive: #9a9e7a;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.dark {
      --bg: #1e1d1a;
      --surface: #2a2926;
      --border: #3d3a35;
      --text: #e8e4dc;
      --text-muted: #8a847a;
      --text-light: #5a5650;
      --cream: #2a2926;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
      background: var(--forest);
      color: #ffffff;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.01em;
    }

    .header-title svg {
      width: 22px;
      height: 22px;
      stroke: rgba(255,255,255,0.8);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .day-tabs {
      display: flex;
      gap: 2px;
    }

    .day-tab {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.7);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .day-tab.active {
      background: rgba(255,255,255,0.95);
      color: var(--forest);
    }

    .day-tab:hover:not(.active) {
      background: rgba(255,255,255,0.18);
    }

    .view-toggle {
      display: flex;
      gap: 2px;
    }

    .view-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.7);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .view-btn svg {
      width: 16px;
      height: 16px;
    }

    .view-btn.active {
      background: rgba(255,255,255,0.95);
      color: var(--forest);
    }

    .view-btn:hover:not(.active) {
      background: rgba(255,255,255,0.18);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 7px 14px;
      transition: background 0.2s ease;
    }

    .search-box:focus-within {
      background: rgba(255,255,255,0.18);
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      stroke: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }

    .search-box input {
      border: none;
      background: none;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 400;
      color: white;
      outline: none;
      width: 140px;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .ics-download {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .ics-download svg {
      width: 16px;
      height: 16px;
    }

    .ics-download:hover {
      background: rgba(255,255,255,0.18);
    }

    .theme-toggle {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.85);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s ease;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.18);
    }

    .main {
      flex: 1;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .grid-view { display: block; }
    .cards-view { display: none; }

    body.view-active .grid-view { display: block; }
    body.view-active .cards-view { display: none; }

    .timetable-wrapper {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .timetable {
      display: grid;
      grid-template-columns: var(--time-col-w) repeat(5, minmax(var(--day-min-w), 1fr));
      min-width: calc(var(--time-col-w) + 5 * var(--day-min-w));
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(139,115,85,0.06);
    }

    .time-header,
    .day-header {
      padding: 14px 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .time-header {
      background: var(--cream);
      color: var(--text-light);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .day-header {
      background: var(--cream);
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .day-header:last-child {
      border-right: none;
    }

    .time-label {
      padding: 8px;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-light);
      text-align: right;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .grid-cell {
      min-height: var(--slot-h);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
    }

    .grid-cell:last-child {
      border-right: none;
    }

    .day-column {
      position: relative;
    }

    .class-block {
      position: absolute;
      left: 4px;
      right: 4px;
      padding: 6px 8px;
      background: var(--cream);
      border-left: 3px solid var(--sage);
      border-radius: 6px;
      font-size: 11px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(139,115,85,0.08);
      transition: box-shadow 0.2s ease, background 0.2s ease;
      z-index: 1;
    }

    .class-block:hover {
      box-shadow: 0 2px 6px rgba(139,115,85,0.14);
      background: var(--bg);
    }

    .class-block .time {
      font-size: 10px;
      color: var(--text-light);
      font-weight: 400;
      margin-bottom: 2px;
    }

    .class-block .subject {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1px;
    }

    .class-block .teacher {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .class-block.compact .subject,
    .class-block.compact .teacher {
      font-size: 10px;
    }

    .now-indicator {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--dusty-rose);
      z-index: 2;
      pointer-events: none;
    }

    .now-indicator::before {
      content: '';
      position: absolute;
      left: -4px;
      top: -3px;
      width: 8px;
      height: 8px;
      background: var(--dusty-rose);
      border-radius: 50%;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .class-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(139,115,85,0.06);
      transition: box-shadow 0.2s ease;
    }

    .class-card:hover {
      box-shadow: 0 2px 8px rgba(139,115,85,0.12);
    }

    .class-card.color-bar {
      border-left: 4px solid var(--sage);
    }

    .class-card-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .class-card-time {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 400;
    }

    .class-card-subject {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .class-card-teacher {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .legend {
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(139,115,85,0.06);
    }

    .legend-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .legend-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--cream);
      padding: 5px 12px;
      border-radius: 6px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .footer {
      padding: 16px 32px;
      font-size: 11px;
      color: var(--text-light);
      border-top: 1px solid var(--border);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .hidden { display: none !important; }
    .dimmed { opacity: 0.25; }

    @media (max-width: 768px) {
      .header { padding: 0 16px; height: auto; min-height: 64px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
      .header-controls { gap: 8px; }
      .main { padding: 16px; }
      .search-box input { width: 100px; }
    }
  </style>
</head>
<body class="view-active grid" data-theme="light">
  <header class="header">
    <div class="header-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Veronikas Schema
    </div>
    <div class="header-controls">
      <div class="day-tabs">
        <button class="day-tab active" data-day="all">Alla</button>
        <button class="day-tab" data-day="1">Mån</button>
        <button class="day-tab" data-day="2">Tis</button>
        <button class="day-tab" data-day="3">Ons</button>
        <button class="day-tab" data-day="4">Tor</button>
        <button class="day-tab" data-day="5">Fre</button>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Schema
        </button>
        <button class="view-btn" data-view="cards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/></svg>
          Kort
        </button>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="search-input" type="text" placeholder="Sök lektion..." />
      </div>
      <a class="ics-download" href="schedule.ics" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        .ics
      </a>
      <button class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main class="main">
    <div class="grid-view">
      <div class="timetable-wrapper">
        <div class="timetable"></div>
      </div>
    </div>
    <div class="cards-view">
      <div class="cards-container"></div>
    </div>
    <div class="legend">
      <div class="legend-title">Ämnen</div>
      <div class="legend-grid"></div>
    </div>
  </main>
  <footer class="footer">Veronikas schema — vecka 36 till 24</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
